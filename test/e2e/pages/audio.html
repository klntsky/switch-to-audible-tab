<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Controllable audio tab</title>
  </head>
  <body>
    <h1>Controllable audio tab</h1>
    <audio id="audio" loop controls></audio>
    <output id="state">paused</output>
    <button id="arm">arm</button>

    <script>
      const sampleRate = 44100;
      const duration = 2;
      const samples = sampleRate * duration;
      const buffer = new ArrayBuffer(44 + samples * 2);
      const view = new DataView(buffer);

      const writeString = (offset, value) => {
        for (let index = 0; index < value.length; index++) {
          view.setUint8(offset + index, value.charCodeAt(index));
        }
      };

      writeString(0, 'RIFF');
      view.setUint32(4, 36 + samples * 2, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(36, 'data');
      view.setUint32(40, samples * 2, true);

      for (let index = 0; index < samples; index++) {
        const sample = Math.sin(2 * Math.PI * 440 * index / sampleRate);
        view.setInt16(44 + index * 2, sample * 0x2000, true);
      }

      const audio = document.querySelector('#audio');
      const state = document.querySelector('#state');
      let playingEvents = 0;
      let pauseEvents = 0;
      audio.src = URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));

      const updateState = () => {
        state.value = audio.paused ? 'paused' : 'playing';
      };

      audio.addEventListener('playing', () => {
        playingEvents++;
        updateState();
      });
      audio.addEventListener('pause', () => {
        pauseEvents++;
        updateState();
      });

      const parameters = new URLSearchParams(location.search);

      window.audioTest = Object.freeze({
        start: async () => {
          await audio.play();
          updateState();
        },
        pause: () => {
          audio.pause();
          updateState();
        },
        playFor: async milliseconds => {
          if (audio.paused) {
            await audio.play();
          }
          await new Promise(resolve => setTimeout(resolve, milliseconds));
          audio.pause();
          updateState();
        },
        isPlaying: () => !audio.paused,
        events: () => ({ playing: playingEvents, pause: pauseEvents }),
        arm: (delay, duration) => {
          setTimeout(() => window.audioTest.playFor(duration), delay);
        },
      });

      // A real click arms a delayed sound, so a test can observe playback that
      // begins while the tab is in the background.
      document.querySelector('#arm').addEventListener('click', () => {
        window.audioTest.arm(
          Number(parameters.get('arm') || 1500),
          Number(parameters.get('duration') || 300)
        );
      });

      // Lets a page start a sound on its own, so a test can observe playback
      // that begins while the tab is in the background.
      if (parameters.has('pulse')) {
        window.audioTest.playFor(Number(parameters.get('pulse')));
      } else if (parameters.has('autoplay')) {
        window.audioTest.start();
      }
    </script>
  </body>
</html>
